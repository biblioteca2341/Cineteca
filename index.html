<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zagalteca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
<style>
/* ============================================================
   TOKENS — warm-dark cinema, single deliberate theme
   ============================================================ */
:root {
  --bg:       #0d0b09;
  --surface:  #151310;
  --surface2: #1d1a16;
  --border:   rgba(255,255,255,.07);
  --border2:  rgba(255,255,255,.12);
  --text:     #ede9e0;
  --text2:    #9a9188;
  --text3:    #5c554d;
  --red:      #E8321A;
  --red-h:    #c0280e;
  --imdb:     #f5c518;
  --mc:       #63b32e;
  --shadow-h: 0 16px 56px rgba(0,0,0,.85);
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   HEADER
   ============================================================ */
.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: .85rem 1.5rem;
}

.header-inner {
  max-width: 1380px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 1.5rem;
  flex-wrap: wrap;
}

.logo { line-height: 1; }

.logo-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2rem;
  letter-spacing: .07em;
  color: #fff;
  display: block;
}

.logo-name .accent { color: var(--red); }

.logo-sub {
  font-size: .6rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--text3);
  font-weight: 400;
  display: block;
  margin-top: 1px;
}

.search-wrap { flex: 1; min-width: 200px; max-width: 480px; }

.search-input {
  width: 100%;
  padding: .5rem 1rem;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: .85rem;
  outline: none;
  transition: border-color .2s, background .2s;
}

.search-input::placeholder { color: var(--text3); }
.search-input:focus { border-color: var(--red); background: var(--surface); }

.header-count {
  font-size: .75rem;
  color: var(--text3);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.header-count b { color: var(--text2); font-weight: 600; }

/* ============================================================
   FILTER BAR
   ============================================================ */
.filter-bar {
  position: sticky;
  top: 63px;
  z-index: 90;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: .6rem 1.5rem;
}

.filter-inner {
  max-width: 1380px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: .4rem;
}

.filter-row {
  display: flex;
  align-items: center;
  gap: .5rem;
  min-height: 28px;
}

.filter-label {
  font-size: .58rem;
  font-weight: 600;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--text3);
  width: 50px;
  flex-shrink: 0;
}

.chips { display: flex; gap: .3rem; flex-wrap: wrap; align-items: center; }

.chip {
  padding: .2rem .6rem;
  border: 1px solid var(--border2);
  border-radius: 4px;
  font-size: .72rem;
  font-weight: 500;
  color: var(--text2);
  background: transparent;
  cursor: pointer;
  transition: border-color .15s, color .15s, background .15s;
  white-space: nowrap;
  font-family: 'Inter', sans-serif;
  line-height: 1.5;
}

.chip:hover { border-color: rgba(232,50,26,.5); color: var(--text); }
.chip.active { background: var(--red); border-color: var(--red); color: #fff; }
.chip:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

.clear-btn {
  font-size: .68rem;
  color: var(--text3);
  background: none;
  border: none;
  cursor: pointer;
  padding: .2rem .3rem;
  font-family: 'Inter', sans-serif;
  margin-left: auto;
  transition: color .15s;
  flex-shrink: 0;
  letter-spacing: .02em;
}

.clear-btn:hover { color: var(--text); }

/* ============================================================
   RESULTS BAR
   ============================================================ */
.results-bar {
  max-width: 1380px;
  margin: 0 auto;
  padding: .85rem 1.5rem .4rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.results-count {
  font-size: .75rem;
  color: var(--text3);
  font-variant-numeric: tabular-nums;
}

.results-count b { color: var(--text2); }

.sort-select {
  padding: .28rem .55rem;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 5px;
  color: var(--text2);
  font-family: 'Inter', sans-serif;
  font-size: .73rem;
  cursor: pointer;
  outline: none;
  transition: border-color .15s;
}

.sort-select:focus { border-color: var(--red); }

/* ============================================================
   GRID
   ============================================================ */
.grid-wrap {
  max-width: 1380px;
  margin: 0 auto;
  padding: .5rem 1.5rem 5rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(178px, 1fr));
  gap: 1rem;
}

/* ============================================================
   CARD
   ============================================================ */
.card {
  border-radius: 7px;
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: transform .22s ease, box-shadow .22s ease, border-color .22s;
  display: flex;
  flex-direction: column;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: var(--shadow-h);
  border-color: rgba(255,255,255,.17);
}

.card:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

.card-poster {
  width: 100%;
  aspect-ratio: 2 / 3;
  object-fit: cover;
  display: block;
  background: var(--surface2);
}

.card-poster-ph {
  width: 100%;
  aspect-ratio: 2 / 3;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: .75rem;
  position: relative;
  overflow: hidden;
}

.card-poster-ph::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.72) 0%, transparent 50%);
}

.ph-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.05rem;
  letter-spacing: .03em;
  color: rgba(255,255,255,.95);
  line-height: 1.1;
  position: relative;
  z-index: 1;
  text-shadow: 0 2px 8px rgba(0,0,0,.9);
}

.card-body {
  padding: .55rem .7rem .7rem;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: .18rem;
}

.card-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1rem;
  letter-spacing: .02em;
  color: var(--text);
  line-height: 1.15;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.card-meta {
  font-size: .67rem;
  color: var(--text3);
  display: flex;
  align-items: center;
  gap: .3rem;
  flex-wrap: wrap;
  line-height: 1.4;
}

.card-year { color: var(--text2); font-weight: 500; }
.meta-dot  { color: var(--text3); }

.card-genre {
  font-size: .61rem;
  padding: .08rem .38rem;
  border-radius: 3px;
  background: rgba(232,50,26,.12);
  color: #df5040;
  border: 1px solid rgba(232,50,26,.2);
  font-weight: 500;
  white-space: nowrap;
}

.card-scores {
  display: flex;
  gap: .45rem;
  margin-top: .2rem;
  align-items: center;
}

.score {
  font-family: 'Bebas Neue', sans-serif;
  font-size: .85rem;
  letter-spacing: .04em;
}

.score.imdb { color: var(--imdb); }
.score.mc   { color: var(--mc); }

/* ============================================================
   EMPTY STATE
   ============================================================ */
.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 5rem 2rem;
}

.empty-heading {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  letter-spacing: .06em;
  color: var(--text2);
  margin-bottom: .4rem;
}

.empty p { font-size: .82rem; color: var(--text3); }

/* ============================================================
   MODAL
   ============================================================ */
.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.8);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}

.modal-backdrop.open { display: flex; }

.modal {
  background: #161210;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 12px;
  max-width: 740px;
  width: 100%;
  max-height: 90vh;
  overflow: hidden;
  box-shadow: 0 40px 100px rgba(0,0,0,.9);
  display: flex;
}

/* Poster column */
.modal-poster-col {
  width: 215px;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  background: var(--surface2);
}

.modal-poster-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.modal-poster-ph {
  width: 100%;
  height: 100%;
  min-height: 340px;
  display: flex;
  align-items: flex-end;
  padding: 1.2rem;
  position: relative;
}

.modal-poster-ph::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.8) 0%, transparent 55%);
}

.modal-ph-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  letter-spacing: .03em;
  color: rgba(255,255,255,.95);
  line-height: 1.1;
  position: relative;
  z-index: 1;
  text-shadow: 0 2px 12px rgba(0,0,0,.9);
}

.modal-close {
  position: absolute;
  top: .65rem;
  right: .65rem;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(0,0,0,.55);
  border: 1px solid rgba(255,255,255,.14);
  color: rgba(255,255,255,.75);
  font-size: .78rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .15s, color .15s;
  z-index: 10;
  font-family: 'Inter', sans-serif;
}

.modal-close:hover { background: var(--red); border-color: var(--red); color: #fff; }

/* Modal body */
.modal-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  min-width: 0;
}

.modal-top { padding: 1.25rem 1.4rem .75rem; }

.modal-badge { margin-bottom: .5rem; }

.type-badge {
  display: inline-block;
  font-size: .57rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .12em;
  padding: .17rem .55rem;
  border-radius: 3px;
}

.type-badge.pelicula {
  background: rgba(232,50,26,.16);
  color: #e05848;
  border: 1px solid rgba(232,50,26,.28);
}

.type-badge.serie {
  background: rgba(99,179,46,.14);
  color: #7ec74a;
  border: 1px solid rgba(99,179,46,.24);
}

.modal-titulo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2rem;
  letter-spacing: .03em;
  color: #fff;
  line-height: 1;
  margin-bottom: .15rem;
  text-wrap: balance;
}

.modal-titulo-original {
  font-size: .73rem;
  color: var(--text3);
  font-style: italic;
  margin-bottom: .6rem;
}

.modal-director {
  font-size: .83rem;
  color: var(--text2);
  font-weight: 500;
  margin-bottom: .75rem;
}

.modal-info {
  display: flex;
  gap: .4rem;
  flex-wrap: wrap;
  margin-bottom: .7rem;
}

.info-pill {
  font-size: .68rem;
  color: var(--text2);
  background: rgba(255,255,255,.055);
  border: 1px solid var(--border2);
  border-radius: 5px;
  padding: .17rem .52rem;
}

.modal-genero { display: flex; gap: .3rem; flex-wrap: wrap; margin-bottom: .9rem; }

.genre-tag {
  font-size: .65rem;
  padding: .14rem .48rem;
  border-radius: 3px;
  background: rgba(232,50,26,.12);
  color: #df5040;
  border: 1px solid rgba(232,50,26,.2);
  font-weight: 500;
}

/* Scores — big Bebas marquee */
.modal-scores {
  display: flex;
  gap: 1.5rem;
  align-items: flex-end;
  padding-bottom: .85rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0;
}

.modal-score { display: flex; flex-direction: column; gap: .08rem; }

.score-label {
  font-size: .57rem;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--text3);
}

.score-value {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.1rem;
  letter-spacing: .04em;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.score-value.imdb { color: var(--imdb); }
.score-value.mc   { color: var(--mc); }

.score-sub { font-size: .6rem; color: var(--text3); margin-top: .05rem; }

/* Synopsis */
.modal-sinopsis {
  font-size: .82rem;
  line-height: 1.78;
  color: var(--text2);
  padding: .85rem 1.4rem;
  background: rgba(255,255,255,.022);
  border-bottom: 1px solid var(--border);
}

/* Reparto */
.modal-section { padding: .7rem 1.4rem; }

.section-label {
  font-size: .57rem;
  font-weight: 600;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: .4rem;
}

.actor-chips { display: flex; gap: .3rem; flex-wrap: wrap; }

.actor-chip {
  font-size: .7rem;
  background: rgba(255,255,255,.048);
  border: 1px solid var(--border2);
  border-radius: 4px;
  padding: .16rem .52rem;
  color: var(--text2);
}

/* Notas del coleccionista */
.modal-notas {
  margin: 0 1.4rem .65rem;
  padding: .5rem .75rem;
  border-left: 2px solid var(--red);
  font-size: .76rem;
  color: var(--text3);
  font-style: italic;
  background: rgba(232,50,26,.04);
  line-height: 1.6;
}

/* Footer */
.modal-footer { padding: .8rem 1.4rem 1.3rem; margin-top: auto; }

.drive-btn {
  display: block;
  text-align: center;
  background: var(--red);
  color: #fff;
  text-decoration: none;
  font-size: .85rem;
  font-weight: 600;
  padding: .72rem 1rem;
  border-radius: 7px;
  letter-spacing: .04em;
  transition: background .18s;
}

.drive-btn:hover { background: var(--red-h); }

.no-disponible {
  font-size: .72rem;
  color: var(--text3);
  text-align: center;
  margin-top: .5rem;
  font-style: italic;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 640px) {
  .site-header  { padding: .7rem 1rem; }
  .filter-bar   { top: 58px; padding: .5rem 1rem; }
  .results-bar  { padding: .7rem 1rem .3rem; }
  .grid-wrap    { padding: .5rem 1rem 4rem; }
  .grid         { grid-template-columns: repeat(2, 1fr); gap: .6rem; }
  .logo-name    { font-size: 1.65rem; }
  .header-count { display: none; }
  .search-wrap  { max-width: none; }

  .modal { flex-direction: column; max-height: 95vh; border-radius: 10px 10px 0 0; align-self: flex-end; }
  .modal-poster-col { width: 100%; height: 220px; }
  .modal-poster-ph  { min-height: 220px; }
  .modal-backdrop   { padding: 0; align-items: flex-end; }
  .modal-titulo     { font-size: 1.6rem; }
  .score-value      { font-size: 1.65rem; }
  .modal-top        { padding: 1rem 1.2rem .65rem; }
  .modal-sinopsis   { padding: .75rem 1.2rem; }
  .modal-section    { padding: .6rem 1.2rem; }
  .modal-notas      { margin: 0 1.2rem .6rem; }
  .modal-footer     { padding: .7rem 1.2rem 1.2rem; }
}

@media (prefers-reduced-motion: reduce) {
  .card              { transition: none; }
  .modal-backdrop    { backdrop-filter: none; -webkit-backdrop-filter: none; }
}
</style>
  </style>
</head>
<body>
<!-- HEADER -->
<header class="site-header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-name">ZAGAL<span class="accent">TECA</span></span>
      <span class="logo-sub">Colección personal de cine</span>
    </div>
    <div class="search-wrap">
      <input
        type="text"
        class="search-input"
        id="busqueda"
        placeholder="Buscar por título, director, actores…"
        oninput="render()"
        autocomplete="off"
        spellcheck="false"
      >
    </div>
    <div class="header-count">
      <b id="cs">0</b> de <b id="ct">0</b>
    </div>
  </div>
</header>

<!-- FILTER BAR -->
<div class="filter-bar">
  <div class="filter-inner">
    <div class="filter-row">
      <span class="filter-label">Tipo</span>
      <div class="chips" id="chips-tipo"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">Formato</span>
      <div class="chips" id="chips-formato"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">Género</span>
      <div class="chips" id="chips-genero"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">Década</span>
      <div class="chips" id="chips-decada"></div>
      <button class="clear-btn" id="clear-btn" onclick="limpiarFiltros()" style="display:none">— limpiar filtros</button>
    </div>
  </div>
</div>

<!-- RESULTS BAR -->
<div class="results-bar">
  <p class="results-count"><b id="count-label">0</b> resultados</p>
  <select class="sort-select" id="orden" onchange="render()">
    <option value="titulo">Título A–Z</option>
    <option value="ano_desc">Más reciente</option>
    <option value="ano_asc">Más antiguo</option>
    <option value="director">Director A–Z</option>
    <option value="imdb">Mayor puntaje IMDb</option>
  </select>
</div>

<div class="grid-wrap">
  <div class="grid" id="grid"></div>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modal-backdrop" onclick="if(event.target===this)cerrarModal()">
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <div class="modal-poster-col" id="modal-poster-col">
      <button class="modal-close" onclick="cerrarModal()" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body" id="modal-body">
      <div class="modal-top">
        <div class="modal-badge"  id="modal-badge"></div>
        <div class="modal-titulo" id="modal-titulo"></div>
        <div class="modal-titulo-original" id="modal-titulo-original"></div>
        <div class="modal-director"        id="modal-director"></div>
        <div class="modal-info"            id="modal-info"></div>
        <div class="modal-genero"          id="modal-genero"></div>
        <div class="modal-scores"          id="modal-scores"></div>
      </div>
      <div class="modal-sinopsis" id="modal-sinopsis"></div>
      <div class="modal-section"  id="modal-actores-section" style="display:none">
        <div class="section-label">Reparto</div>
        <div class="actor-chips"  id="modal-actores"></div>
      </div>
      <div id="modal-notas"></div>
      <div class="modal-footer">
        <a href="#" class="drive-btn" id="modal-drive-btn" target="_blank" rel="noopener">▶ VER PELÍCULA</a>
        <div class="no-disponible" id="modal-no-disponible" style="display:none">
          Esta película no está disponible actualmente en el Drive.
        </div>
      </div>
    </div>
  </div>
</div>

<script>
<script>
/* ============================================================
   DATA — 10 películas piloto
   ============================================================ */
const PELICULAS = [
  {
    titulo: 'Yi Yi',
    titulo_original: 'Yi Yi: A One and a Two',
    director: 'Edward Yang',
    ano: 2000, decada: '2000s', pais: 'Taiwán', genero: 'Drama',
    actores: ['Wu Nien-jen', 'Elaine Jin', 'Kelly Lee'],
    sinopsis: 'Un fin de semana en la vida de una familia de clase media en Taipéi. A través de tres generaciones —un empresario desencantado, su esposa ansiosa, su madre en coma, su hija adolescente y su hijo de ocho años—, Edward Yang retrata el amor, la decepción, la curiosidad y la muerte con una precisión extraordinaria.',
    poster: 'https://image.tmdb.org/t/p/w500/mR8dSQZI8X6Z1NClJhFrtJp636z.jpg', imdb: 8.1, metacritic: 91, duracion: 173,
    tipo: 'pelicula', formato: 'ficcion', disponible: 'si', drive_link: '#',
    notas_alejandro: 'Una de las más grandes películas de los últimos treinta años.'
  },
  {
    titulo: 'Mulholland Drive',
    titulo_original: '',
    director: 'David Lynch',

};
function genreGrad(g) { return GENRE_BG[g] || 'linear-gradient(152deg, #111 0%, #1e1e1e 100%)'; }

/* Todas las décadas de la historia del cine */
const TODAS_DECADAS = ['1920s','1930s','1940s','1950s','1960s','1970s','1980s','1990s','2000s','2010s','2020s'];

/* ============================================================
   STATE
   ============================================================ */
let filtroTipo    = 'todas';
let filtroFormato = '';
let filtroGenero  = '';
let filtroDecada  = '';

/* ============================================================
   BUILD CHIPS — all dynamic from data
   ============================================================ */
function buildChips() {
  const tipoEl = document.getElementById('chips-tipo');
  [['Todas', 'todas'], ['Películas', 'pelicula'], ['Series', 'serie']].forEach(([lbl, val], i) => {
    const b = chip(lbl, i === 0);
    b.onclick = () => { filtroTipo = val; activate(tipoEl, b); render(); };
    tipoEl.appendChild(b);
  });

  const formatoEl = document.getElementById('chips-formato');
  [['Todos', ''], ['Ficción', 'ficcion'], ['Documental', 'documental']].forEach(([lbl, val], i) => {
    const b = chip(lbl, i === 0);
    b.onclick = () => { filtroFormato = val; activate(formatoEl, b); render(); };
    formatoEl.appendChild(b);
  });

  const generoEl = document.getElementById('chips-genero');
  const generos  = [...new Set(PELICULAS.map(p => p.genero).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'es'));
  [['Todos', ''], ...generos.map(g => [g, g])].forEach(([lbl, val], i) => {
    const b = chip(lbl, i === 0);
    b.onclick = () => { filtroGenero = val; activate(generoEl, b); render(); };
    generoEl.appendChild(b);
  });

  const decadaEl = document.getElementById('chips-decada');
  [['Todas', ''], ...TODAS_DECADAS.map(d => [d, d])].forEach(([lbl, val], i) => {
    const b = chip(lbl, i === 0);
    // Dimm decades with no content
    if (val && !PELICULAS.some(p => p.decada === val)) b.style.opacity = '.35';
    b.onclick = () => { filtroDecada = val; activate(decadaEl, b); render(); };
    decadaEl.appendChild(b);
  });
}

function chip(label, active) {
  const b = document.createElement('button');
  b.className = 'chip' + (active ? ' active' : '');
  b.textContent = label;
  return b;
}

function activate(container, el) {
  container.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}

/* ============================================================
   FILTER + SORT
   ============================================================ */
function filtrar() {
  const q = document.getElementById('busqueda').value.toLowerCase().trim();
  return PELICULAS.filter(p => {
    if (filtroTipo !== 'todas' && p.tipo !== filtroTipo) return false;
    if (filtroFormato && p.formato !== filtroFormato) return false;
    if (filtroGenero && p.genero !== filtroGenero) return false;
    if (filtroDecada && p.decada !== filtroDecada) return false;
    if (q) {
      const hay = [p.titulo, p.titulo_original, p.director, ...(p.actores || [])].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function ordenar(lista) {
  const ord = document.getElementById('orden').value;
  return [...lista].sort((a, b) => {
    if (ord === 'titulo')   return a.titulo.localeCompare(b.titulo, 'es');
    if (ord === 'ano_desc') return (b.ano || 0) - (a.ano || 0);
    if (ord === 'ano_asc')  return (a.ano || 0) - (b.ano || 0);
    if (ord === 'director') return (a.director || '').localeCompare(b.director || '', 'es');
    if (ord === 'imdb')     return (b.imdb || 0) - (a.imdb || 0);
    return 0;
  });
}

/* ============================================================
   RENDER GRID
   ============================================================ */
function render() {
  const lista = ordenar(filtrar());
  const grid  = document.getElementById('grid');
  grid.innerHTML = '';

  document.getElementById('cs').textContent = lista.length;
  document.getElementById('ct').textContent = PELICULAS.length;
  document.getElementById('count-label').textContent = lista.length;

  const hasFilters = filtroTipo !== 'todas' || filtroFormato || filtroGenero || filtroDecada
                   || document.getElementById('busqueda').value;
  document.getElementById('clear-btn').style.display = hasFilters ? '' : 'none';

  if (!lista.length) {
    grid.innerHTML = `<div class="empty">
      <div class="empty-heading">Sin resultados</div>
      <p>Probá con otros filtros o un término diferente.</p>
    </div>`;
    return;
  }

  lista.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.tabIndex  = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `${p.titulo}${p.ano ? ` (${p.ano})` : ''}`);

    // Poster
    const grad = genreGrad(p.genero);
    const posterHTML = p.poster
      ? `<img class="card-poster" src="${p.poster}" alt="${p.titulo}" loading="lazy"
           onerror="this.replaceWith(makePh('${escQ(p.titulo)}','${escQ(grad)}'))">`
      : `<div class="card-poster-ph" style="background:${grad}">
           <span class="ph-title">${esc(p.titulo)}</span>
         </div>`;

    // Scores
    let scHTML = '';
    if (p.imdb)       scHTML += `<span class="score imdb">★ ${p.imdb}</span>`;
    if (p.metacritic) scHTML += `<span class="score mc">MC ${p.metacritic}</span>`;

    card.innerHTML = `
      ${posterHTML}
      <div class="card-body">
        <div class="card-title">${esc(p.titulo)}</div>
        <div class="card-meta">
          ${p.director ? esc(p.director) : ''}
          ${p.ano ? `<span class="meta-dot">·</span><span class="card-year">${p.ano}</span>` : ''}
          ${p.genero ? `<span class="card-genre">${esc(p.genero)}</span>` : ''}
        </div>
        ${scHTML ? `<div class="card-scores">${scHTML}</div>` : ''}
      </div>`;

    card.onclick  = () => abrirModal(p);
    card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrirModal(p); } };
    grid.appendChild(card);
  });
}

function limpiarFiltros() {
  filtroTipo = 'todas'; filtroFormato = ''; filtroGenero = ''; filtroDecada = '';
  document.getElementById('busqueda').value = '';
  ['chips-tipo', 'chips-formato', 'chips-genero', 'chips-decada'].forEach(id =>
    document.getElementById(id).querySelectorAll('.chip').forEach((c, i) => c.classList.toggle('active', i === 0))
  );
  render();
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escQ(s) { return String(s || '').replace(/'/g,"\\'"); }

function makePh(title, grad) {
  const d = document.createElement('div');
  d.className = 'card-poster-ph';
  d.style.background = grad;
  d.innerHTML = `<span class="ph-title">${esc(title)}</span>`;
  return d;
}

function makeModalPh(title, grad) {
  const d = document.createElement('div');
  d.className = 'modal-poster-ph';
  d.style.background = grad;
  d.innerHTML = `<span class="modal-ph-title">${esc(title)}</span>`;
  return d;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });
